name: DevxyzBrowser Android Verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v3
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Lint
        run: gradle --no-daemon :app:lintDebug
      - name: Verify APK
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          test -n "$APK"
          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)/aapt dump badging "$APK" | grep "package: name='com.jepongdevxyz.browser'"
      - uses: actions/upload-artifact@v4
        with:
          name: DevxyzBrowser-debug-apk
          path: app/build/outputs/apk/debug/*.apk
