name: DevxyzBrowser Android Verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Verify Android SDK
        run: |
          test -d "$ANDROID_HOME"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          test -d "$ANDROID_HOME/platforms/android-37.0"
          test -d "$ANDROID_HOME/build-tools"
      - name: Pin and inspect official OpenVPN 3 core
        run: |
          git clone --filter=blob:none https://github.com/OpenVPN/openvpn3.git "$RUNNER_TEMP/openvpn3"
          git -C "$RUNNER_TEMP/openvpn3" checkout 2986b58108726a7aff278a50caa0cff9c4cdf943
          test "$(git -C "$RUNNER_TEMP/openvpn3" rev-parse HEAD)" = "2986b58108726a7aff278a50caa0cff9c4cdf943"
          test -f "$RUNNER_TEMP/openvpn3/client/ovpncli.hpp"
          test -f "$RUNNER_TEMP/openvpn3/client/ovpncli.i"
          grep -q "class OpenVPNClient" "$RUNNER_TEMP/openvpn3/client/ovpncli.hpp"
          grep -q "TunBuilderBase" "$RUNNER_TEMP/openvpn3/client/ovpncli.hpp"
      - name: Verify pinned OpenVPN 3 client and TUN API
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends swig
          mkdir -p "$RUNNER_TEMP/ovpn3-java/net/openvpn/ovpn3"
          cd "$RUNNER_TEMP/openvpn3"
          swig -c++ -java -package net.openvpn.ovpn3 \
            -outdir "$RUNNER_TEMP/ovpn3-java/net/openvpn/ovpn3" \
            -DOPENVPN_PLATFORM_ANDROID \
            -Iclient -I. \
            -o "$RUNNER_TEMP/ovpncli_wrap.cxx" \
            client/ovpncli.i
          test -s "$RUNNER_TEMP/ovpncli_wrap.cxx"
          echo "Generated SWIG Java files:"
          find "$RUNNER_TEMP/ovpn3-java" -type f -name "*.java" -print | sort
          OPENVPN_CLIENT=$(find "$RUNNER_TEMP/ovpn3-java" -type f -name "ClientAPI_OpenVPNClient.java" -print -quit)
          test -n "$OPENVPN_CLIENT"
          test -s "$OPENVPN_CLIENT"
          grep -q "class ClientAPI_OpenVPNClient" "$OPENVPN_CLIENT"
          TUN_BUILDER=$(find "$RUNNER_TEMP/ovpn3-java" -type f -name "ClientAPI_TunBuilderBase.java" -print -quit)
          test -n "$TUN_BUILDER"
          test -s "$TUN_BUILDER"
          grep -q "class ClientAPI_TunBuilderBase" "$TUN_BUILDER"
      - name: Probe OpenVPN 3 native Android prerequisites
        run: |
          set -euo pipefail
          check_file() { echo "CHECK file: $1"; test -f "$1"; }
          check_dep() { echo "CHECK dependency: $1"; grep -q "\"$1\"" "$RUNNER_TEMP/openvpn3/vcpkg.json"; }
          echo "ANDROID_NDK_ROOT=${ANDROID_NDK_ROOT:-<unset>}"
          echo "ANDROID_NDK_HOME=${ANDROID_NDK_HOME:-<unset>}"
          NDK="${ANDROID_NDK_ROOT:-${ANDROID_NDK_HOME:-}}"
          if [ -z "$NDK" ]; then NDK=$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sort -V | tail -1); fi
          echo "Resolved NDK=$NDK"
          test -n "$NDK"
          check_file "$NDK/build/cmake/android.toolchain.cmake"
          check_file "$RUNNER_TEMP/openvpn3/client/ovpncli.cpp"
          check_file "$RUNNER_TEMP/openvpn3/openvpn/openssl/xkey/xkey_provider.c"
          check_file "$RUNNER_TEMP/openvpn3/openvpn/openssl/xkey/xkey_helper.c"
          check_file "$RUNNER_TEMP/openvpn3/vcpkg.json"
          echo "Declared vcpkg dependencies:"
          cat "$RUNNER_TEMP/openvpn3/vcpkg.json"
          check_dep asio
          check_dep openssl
          check_dep lz4
          check_dep fmt
          cmake --version
          CLANG=$(find "$NDK/toolchains/llvm/prebuilt" \( -type f -o -type l \) -name "clang++" -print -quit)
          echo "Resolved clang++=$CLANG"
          test -n "$CLANG"
          "$CLANG" --version
      - name: Build pinned OpenVPN 3 native Android ARM64 client
        run: |
          set -euo pipefail
          NDK="${ANDROID_NDK_ROOT:-${ANDROID_NDK_HOME:-}}"
          if [ -z "$NDK" ]; then NDK=$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1); fi
          test -n "$NDK"
          export ANDROID_NDK_HOME="$NDK"
          export VCPKG_ROOT="$RUNNER_TEMP/vcpkg"
          git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" checkout a51bb4d1434e6d0927ff79db8033bed8522b85df
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          mkdir -p "$RUNNER_TEMP/vcpkg-triplets" "$RUNNER_TEMP/ovpn3-android-manifest" "$RUNNER_TEMP/openvpn3-android-cmake"
          cat > "$RUNNER_TEMP/vcpkg-triplets/arm64-android-api26.cmake" <<'EOF'
          set(VCPKG_TARGET_ARCHITECTURE arm64)
          set(VCPKG_CRT_LINKAGE dynamic)
          set(VCPKG_LIBRARY_LINKAGE static)
          set(VCPKG_CMAKE_SYSTEM_NAME Android)
          set(VCPKG_CMAKE_SYSTEM_VERSION 26)
          set(VCPKG_CHAINLOAD_TOOLCHAIN_FILE "$ENV{ANDROID_NDK_HOME}/build/cmake/android.toolchain.cmake")
          set(VCPKG_MAKE_BUILD_TRIPLET "--host=aarch64-linux-android")
          set(VCPKG_CMAKE_CONFIGURE_OPTIONS -DANDROID_ABI=arm64-v8a)
          set(VCPKG_BUILD_TYPE release)
          EOF
          cat > "$RUNNER_TEMP/ovpn3-android-manifest/vcpkg.json" <<'EOF'
          {
            "name": "devxyz-openvpn3-android",
            "version-string": "1.0.0",
            "dependencies": ["asio", "fmt", "lz4", "openssl"]
          }
          EOF
          "$VCPKG_ROOT/vcpkg" install --triplet arm64-android-api26 \
            --overlay-triplets "$RUNNER_TEMP/vcpkg-triplets" \
            --overlay-ports "$RUNNER_TEMP/openvpn3/deps/vcpkg-ports" \
            --x-manifest-root "$RUNNER_TEMP/ovpn3-android-manifest" \
            --x-install-root "$RUNNER_TEMP/vcpkg-installed"
          cp -a "$RUNNER_TEMP/openvpn3/client" "$RUNNER_TEMP/openvpn3/cmake" "$RUNNER_TEMP/openvpn3/openvpn" "$RUNNER_TEMP/openvpn3/deps" "$RUNNER_TEMP/openvpn3-android-cmake/"
          cp app/src/main/cpp/openvpn3_jni.cpp "$RUNNER_TEMP/openvpn3-android-cmake/android_jni.cpp"
          OVPN3_CMAKE="$RUNNER_TEMP/openvpn3-android-cmake" python3 - <<'PY'
          import os
          from pathlib import Path
          cmake = Path(os.environ["OVPN3_CMAKE"]) / "cmake/findcoredeps.cmake"
          text = cmake.read_text()
          old_ssl = "pkg_search_module(OpenSSL REQUIRED IMPORTED_TARGET openssl)\n        SET(SSL_LIBRARY PkgConfig::OpenSSL)"
          new_ssl = "find_package(OpenSSL REQUIRED)\n        SET(SSL_LIBRARY OpenSSL::SSL OpenSSL::Crypto)"
          old_threads = "if(UNIX)\n        target_link_libraries(${target} pthread)\n    endif()"
          new_threads = "if(UNIX AND NOT ANDROID)\n        target_link_libraries(${target} pthread)\n    endif()"
          assert old_ssl in text
          assert old_threads in text
          text = text.replace(old_ssl, new_ssl).replace(old_threads, new_threads)
          cmake.write_text(text)
          PY
          cat > "$RUNNER_TEMP/openvpn3-android-cmake/CMakeLists.txt" <<'EOF'
          cmake_minimum_required(VERSION 3.16...3.30)
          project(OpenVPN3Android LANGUAGES C CXX)
          set(CMAKE_CXX_STANDARD 20)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)
          set(CMAKE_CXX_EXTENSIONS OFF)
          set(CMAKE_C_STANDARD 99)
          set(CMAKE_MODULE_PATH "${CMAKE_CURRENT_SOURCE_DIR}/cmake")
          include(CTest)
          include(findcoredeps)
          add_library(xkey STATIC
            openvpn/openssl/xkey/xkey_helper.c
            openvpn/openssl/xkey/xkey_provider.c)
          target_compile_definitions(xkey INTERFACE -DENABLE_EXTERNAL_PKI)
          add_ssl_library(xkey)
          add_library(openvpn3_core SHARED client/ovpncli.cpp android_jni.cpp)
          target_include_directories(openvpn3_core PRIVATE "${CMAKE_CURRENT_SOURCE_DIR}" client)
          target_link_libraries(openvpn3_core xkey)
          add_core_dependencies(openvpn3_core)
          set_target_properties(openvpn3_core PROPERTIES OUTPUT_NAME openvpn3_core)
          EOF
          TRIPLET="$RUNNER_TEMP/vcpkg-triplets/arm64-android-api26.cmake"
          VCPKG_INSTALLED="$RUNNER_TEMP/vcpkg-installed/arm64-android-api26"
          sudo apt-get install -y --no-install-recommends pkg-config
          export PKG_CONFIG_PATH="$VCPKG_INSTALLED/lib/pkgconfig:$VCPKG_INSTALLED/lib64/pkgconfig"
          pkg-config --modversion openssl
          TOOLCHAIN="$NDK/build/cmake/android.toolchain.cmake"
          cmake -S "$RUNNER_TEMP/openvpn3-android-cmake" -B "$RUNNER_TEMP/openvpn3-android-build" -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" \
            -DVCPKG_MANIFEST_MODE=OFF \
            -DANDROID_NDK="$NDK" -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_shared -DCLI_NULLTUN=OFF -DCLI_TUNBUILDER=ON \
            -DBUILD_SWIG_LIB=OFF -DCMAKE_BUILD_TYPE=Release \
            -DASIO_INCLUDE_DIR="$VCPKG_INSTALLED/include" \
            -Dfmt_DIR="$VCPKG_INSTALLED/share/fmt" \
            -DOPENSSL_INCLUDE_DIR="$VCPKG_INSTALLED/include" \
            -DOPENSSL_SSL_LIBRARY="$VCPKG_INSTALLED/lib/libssl.a" \
            -DOPENSSL_CRYPTO_LIBRARY="$VCPKG_INSTALLED/lib/libcrypto.a" \
            -DLZ4_INCLUDE_DIR="$VCPKG_INSTALLED/include" \
            -DLZ4_LIBRARY="$VCPKG_INSTALLED/lib/liblz4.a"
          cmake --build "$RUNNER_TEMP/openvpn3-android-build" --target openvpn3_core --verbose 2>&1 | tee "$RUNNER_TEMP/openvpn3-native-build.log"
          ELF="$RUNNER_TEMP/openvpn3-android-build/libopenvpn3_core.so"
          test -s "$ELF"
          NDK_READELF="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          test -x "$NDK_READELF"
          "$NDK_READELF" -h "$ELF" > "$RUNNER_TEMP/openvpn3-elf-header.txt"
          cat "$RUNNER_TEMP/openvpn3-elf-header.txt"
          grep -q "Machine:.*AArch64" "$RUNNER_TEMP/openvpn3-elf-header.txt"
          NDK_NM="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          "$NDK_NM" -D --defined-only "$ELF" | grep -q "Java_com_jepongdevxyz_browser_vpn_NativeOpenVpn_start"
          "$NDK_NM" -D --defined-only "$ELF" | grep -q "Java_com_jepongdevxyz_browser_vpn_NativeOpenVpn_stop"
          file "$ELF"
          JNI_LIBS="app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$JNI_LIBS"
          install -m 0644 "$ELF" "$JNI_LIBS/libopenvpn3_core.so"
          CXX_RUNTIME="$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so"
          test -s "$CXX_RUNTIME"
          install -m 0644 "$CXX_RUNTIME" "$JNI_LIBS/libc++_shared.so"
          echo "Pinned OpenVPN 3 ARM64 core and its C++ runtime are staged for APK packaging."
          LICENSES="app/src/main/assets/licenses"
          mkdir -p "$LICENSES/openvpn3" "$LICENSES/third-party"
          cp "$RUNNER_TEMP/openvpn3/LICENSES/MPL-2.0.txt" "$LICENSES/openvpn3/"
          cp "$RUNNER_TEMP/openvpn3/LICENSES/AGPL-3.0-only.txt" "$LICENSES/openvpn3/"
          cp "$RUNNER_TEMP/openvpn3/LICENSES/openvpn3-openssl-exception.txt" "$LICENSES/openvpn3/"
          for package in asio fmt lz4 openssl; do
            test -s "$VCPKG_INSTALLED/share/$package/copyright"
            cp "$VCPKG_INSTALLED/share/$package/copyright" "$LICENSES/third-party/$package.txt"
          done
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Lint
        run: gradle --no-daemon :app:lintDebug
      - name: Verify package and APK signature
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          test -n "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -x "$AAPT"
          test -x "$APKSIGNER"
          "$AAPT" dump badging "$APK" | grep "package: name='com.jepongdevxyz.browser'"
          unzip -Z1 "$APK" | grep -qx 'lib/arm64-v8a/libopenvpn3_core.so'
          unzip -Z1 "$APK" | grep -qx 'lib/arm64-v8a/libc++_shared.so'
          unzip -Z1 "$APK" | grep -qx 'assets/licenses/openvpn3/MPL-2.0.txt'
          unzip -Z1 "$APK" | grep -qx 'assets/licenses/third-party/openssl.txt'
          "$APKSIGNER" verify --verbose "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: DevxyzBrowser-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
