name: DevxyzBrowser Android Verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Verify Android SDK
        run: |
          test -d "$ANDROID_HOME"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          test -d "$ANDROID_HOME/platforms/android-37.0"
          test -d "$ANDROID_HOME/build-tools"
      - name: Pin and inspect official OpenVPN 3 core
        run: |
          git clone --filter=blob:none https://github.com/OpenVPN/openvpn3.git "$RUNNER_TEMP/openvpn3"
          git -C "$RUNNER_TEMP/openvpn3" checkout 2986b58108726a7aff278a50caa0cff9c4cdf943
          test "$(git -C "$RUNNER_TEMP/openvpn3" rev-parse HEAD)" = "2986b58108726a7aff278a50caa0cff9c4cdf943"
          test -f "$RUNNER_TEMP/openvpn3/client/ovpncli.hpp"
          test -f "$RUNNER_TEMP/openvpn3/client/ovpncli.i"
          grep -q "class OpenVPNClient" "$RUNNER_TEMP/openvpn3/client/ovpncli.hpp"
          grep -q "TunBuilderBase" "$RUNNER_TEMP/openvpn3/client/ovpncli.hpp"
      - name: Generate OpenVPN 3 Android SWIG/JNI bridge
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends swig
          mkdir -p "$RUNNER_TEMP/ovpn3-java/net/openvpn/ovpn3"
          cd "$RUNNER_TEMP/openvpn3"
          swig -c++ -java -package net.openvpn.ovpn3 \
            -outdir "$RUNNER_TEMP/ovpn3-java/net/openvpn/ovpn3" \
            -DOPENVPN_PLATFORM_ANDROID \
            -Iclient -I. \
            -o "$RUNNER_TEMP/ovpncli_wrap.cxx" \
            client/ovpncli.i
          test -s "$RUNNER_TEMP/ovpncli_wrap.cxx"
          echo "Generated SWIG Java files:"
          find "$RUNNER_TEMP/ovpn3-java" -type f -name "*.java" -print | sort
          OPENVPN_CLIENT=$(find "$RUNNER_TEMP/ovpn3-java" -type f -name "ClientAPI_OpenVPNClient.java" -print -quit)
          test -n "$OPENVPN_CLIENT"
          test -s "$OPENVPN_CLIENT"
          grep -q "class ClientAPI_OpenVPNClient" "$OPENVPN_CLIENT"
          TUN_BUILDER=$(find "$RUNNER_TEMP/ovpn3-java" -type f -name "ClientAPI_TunBuilderBase.java" -print -quit)
          test -n "$TUN_BUILDER"
          test -s "$TUN_BUILDER"
          grep -q "class ClientAPI_TunBuilderBase" "$TUN_BUILDER"
      - name: Probe OpenVPN 3 native Android prerequisites
        run: |
          set -euo pipefail
          check_file() { echo "CHECK file: $1"; test -f "$1"; }
          check_dep() { echo "CHECK dependency: $1"; grep -q "\"$1\"" "$RUNNER_TEMP/openvpn3/vcpkg.json"; }
          echo "ANDROID_NDK_ROOT=${ANDROID_NDK_ROOT:-<unset>}"
          echo "ANDROID_NDK_HOME=${ANDROID_NDK_HOME:-<unset>}"
          NDK="${ANDROID_NDK_ROOT:-${ANDROID_NDK_HOME:-}}"
          if [ -z "$NDK" ]; then NDK=$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sort -V | tail -1); fi
          echo "Resolved NDK=$NDK"
          test -n "$NDK"
          check_file "$NDK/build/cmake/android.toolchain.cmake"
          check_file "$RUNNER_TEMP/openvpn3/client/ovpncli.cpp"
          check_file "$RUNNER_TEMP/openvpn3/openvpn/openssl/xkey/xkey_provider.c"
          check_file "$RUNNER_TEMP/openvpn3/openvpn/openssl/xkey/xkey_helper.c"
          check_file "$RUNNER_TEMP/openvpn3/vcpkg.json"
          echo "Declared vcpkg dependencies:"
          cat "$RUNNER_TEMP/openvpn3/vcpkg.json"
          check_dep asio
          check_dep openssl
          check_dep lz4
          check_dep fmt
          cmake --version
          CLANG=$(find "$NDK/toolchains/llvm/prebuilt" \( -type f -o -type l \) -name "clang++" -print -quit)
          echo "Resolved clang++=$CLANG"
          test -n "$CLANG"
          "$CLANG" --version
      - name: Configure OpenVPN 3 Android native core
        run: |
          set -euo pipefail
          NDK="${ANDROID_NDK_ROOT:-${ANDROID_NDK_HOME:-}}"
          test -n "$NDK"
          mkdir -p "$RUNNER_TEMP/ovpn3-native"
          # OpenVPN 3 uses standalone Asio headers. Ubuntu's libasio-dev supplies
          # the headers for the configure probe; Android compilation still uses
          # the NDK toolchain selected below.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasio-dev liblz4-dev
          ASIO_INCLUDE_DIR=$(dpkg -L libasio-dev | awk '/\/asio\.hpp$/ {sub(/\/asio\.hpp$/, "", $0); print; exit}')
          echo "Resolved ASIO_INCLUDE_DIR=$ASIO_INCLUDE_DIR"
          test -f "$ASIO_INCLUDE_DIR/asio.hpp"
          LZ4_INCLUDE_DIR=$(dpkg -L liblz4-dev | awk '/\/lz4\.h$/ {sub(/\/lz4\.h$/, "", $0); print; exit}')
          echo "Resolved LZ4_INCLUDE_DIR=$LZ4_INCLUDE_DIR"
          test -f "$LZ4_INCLUDE_DIR/lz4.h"
          LZ4_LIBRARY=$(find /usr/lib -type f -name 'liblz4.so' -print -quit)
          echo "Resolved LZ4_LIBRARY=$LZ4_LIBRARY"
          test -n "$LZ4_LIBRARY"
          cmake -S "$RUNNER_TEMP/openvpn3" -B "$RUNNER_TEMP/ovpn3-native" \
            -DASIO_INCLUDE_DIR="$ASIO_INCLUDE_DIR" \
            -DLZ4_INCLUDE_DIR="$LZ4_INCLUDE_DIR" \
            -DLZ4_LIBRARY="$LZ4_LIBRARY" \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF
          test -f "$RUNNER_TEMP/ovpn3-native/CMakeCache.txt"
          echo "OpenVPN 3 Android CMake configuration completed."
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Lint
        run: gradle --no-daemon :app:lintDebug
      - name: Verify package and APK signature
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          test -n "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -x "$AAPT"
          test -x "$APKSIGNER"
          "$AAPT" dump badging "$APK" | grep "package: name='com.jepongdevxyz.browser'"
          "$APKSIGNER" verify --verbose "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: DevxyzBrowser-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
